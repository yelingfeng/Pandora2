name: CI & Publish Pandora2

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      publish:
        description: 'Run npm publish'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================
  # Build & Test
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build (lib)
        run: pnpm run build:lib

      - name: Test
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # =========================
  # Publish (npm)
  # =========================
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # 手动触发优先：仅在 workflow_dispatch 且显式选择 publish=true 时发布。
    # 注意：分支 push（含 main）不再触发发布，避免与下面的 release job 重复发版。
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug publish condition
        run: |
          echo "event_name = ${{ github.event_name }}"
          echo "ref        = ${{ github.ref }}"
          echo "publish    = ${{ github.event.inputs.publish }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          registry-url: https://registry.npmjs.org/
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (npm)
        run: pnpm run build:npm

      - name: Ensure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # =========================
  # Release (Changesets)
  # 仅在推送 v* tag 时由 Changesets 负责发版，与上面的手动 publish job 互斥。
  # 前提：先在本地执行 `pnpm changeset` + `pnpm version-packages` 并提交，
  #      再打 tag 推送，此时 .changeset 已被消费、package.json 版本已更新。
  # =========================
  release:
    name: Publish (Changesets)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          registry-url: https://registry.npmjs.org/
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (npm)
        run: pnpm run build:npm

      - name: Publish with Changesets
        run: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
