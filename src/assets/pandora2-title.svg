<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- 字体现代渐变 -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3B6F" />
      <stop offset="50%" stop-color="#5B8CFF" />
      <stop offset="100%" stop-color="#5AD8FF" />
    </linearGradient>
    
    <!-- 珊瑚红高亮渐变 -->
    <linearGradient id="coral-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A7F" />
      <stop offset="100%" stop-color="#FF6A5F" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5B8CFF" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 纯白背景 -->
  <rect width="800" height="300" fill="#FFFFFF" />

  <!-- Pandora2 艺术字组合 -->
  <g font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-weight="800" font-size="120" filter="url(#soft-shadow)">
    
    <!-- P -->
    <text x="80" y="195" fill="url(#text-gradient)">P</text>
    
    <!-- a -->
    <text x="160" y="195" fill="url(#text-gradient)">a</text>
    
    <!-- n -->
    <text x="230" y="195" fill="url(#text-gradient)">n</text>
    
    <!-- d -->
    <text x="305" y="195" fill="url(#text-gradient)">d</text>
    
    <!-- o (内嵌微型光芒点设计) -->
    <g>
      <text x="385" y="195" fill="url(#text-gradient)">o</text>
      <!-- 字母o中间的微型蓝色能量孔 -->
      <circle cx="417" cy="140" r="8" fill="#5AD8FF" />
    </g>
    
    <!-- r -->
    <text x="455" y="195" fill="url(#text-gradient)">r</text>
    
    <!-- a -->
    <text x="510" y="195" fill="url(#text-gradient)">a</text>
    
    <!-- 数字 2 (采用珊瑚红跳跃设计，象征组件库的活跃爆发力) -->
    <text x="590" y="195" fill="url(#coral-gradient)">2</text>

  </g>

  <!-- 辅助装饰图形：下方极简科技底座线条 -->
  <path d="M 80,225 L 650,225" stroke="#E6F4FF" stroke-width="4" stroke-linecap="round" />
  <path d="M 80,225 L 180,225" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round" />
  <circle cx="650" cy="225" r="4" fill="#FF6A5F" />
</svg>
